name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: runtime
      DB_USER: runtime
      DB_PASSWORD: runtime-ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: runtime
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime -d runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check formatting and run tests
        run: sh ./mvnw --batch-mode --no-transfer-progress spotless:check verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  containers:
    name: Deployment containers
    runs-on: ubuntu-latest
    needs: [ frontend, backend ]
    permissions:
      contents: read
      packages: write
    env:
      DB_PASSWORD: container-build-only
      FRONTEND_URL: https://runtime.example.com
      IMAGE_TAG: container-build-only
      SPRING_SECURITY_USER_PASSWORD: container-build-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f compose.coolify.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend container
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/crossera-labs/runtime-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend container
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/crossera-labs/runtime-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: containers
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.COOLIFY_DEPLOY_ENABLED == 'true'
    environment: production
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm tested commit is still current
        id: commit
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select tested application revision
        if: steps.commit.outputs.deploy == 'true'
        run: |
          revision="$(jq --null-input --arg sha "$GITHUB_SHA" \
            '{git_commit_sha: $sha}')"
          curl --fail-with-body \
            --request PATCH \
            "${COOLIFY_URL%/}/api/v1/applications/${COOLIFY_APPLICATION_UUID}" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$revision"

          payload="$(jq --null-input --arg tag "$GITHUB_SHA" \
            '{data: [{key: "IMAGE_TAG", value: $tag, is_literal: true}]}')"
          curl --fail-with-body \
            --request PATCH \
            "${COOLIFY_URL%/}/api/v1/applications/${COOLIFY_APPLICATION_UUID}/envs/bulk" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload"

      - name: Trigger Coolify deployment
        id: deployment
        if: steps.commit.outputs.deploy == 'true'
        run: |
          response="$(curl --fail-with-body \
            --request POST \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APPLICATION_UUID}" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")"
          deployment_uuid="$(jq --raw-output \
            '.deployments[0].deployment_uuid // empty' <<< "$response")"
          if [ -z "$deployment_uuid" ]; then
            echo "Coolify did not return a deployment UUID."
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment
        if: steps.commit.outputs.deploy == 'true'
        run: |
          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body \
              "${COOLIFY_URL%/}/api/v1/deployments/${{ steps.deployment.outputs.deployment_uuid }}" \
              --header "Authorization: Bearer $COOLIFY_TOKEN")"
            status="$(jq --raw-output '.status // empty' <<< "$response")"
            case "$status" in
              finished)
                exit 0
                ;;
              failed|cancelled|cancelled-by-user)
                echo "Coolify deployment ended with status: $status"
                exit 1
                ;;
            esac
            echo "Coolify deployment status: ${status:-unknown} (attempt $attempt/60)"
            sleep 10
          done
          echo "Timed out waiting for the Coolify deployment."
          exit 1
