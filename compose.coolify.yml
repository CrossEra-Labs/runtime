services:
  backend:
    image: ghcr.io/crossera-labs/runtime-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-runtime}
      DB_USER: ${DB_USER:-runtime}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME:-runtime-admin}
      SPRING_SECURITY_USER_PASSWORD: ${SPRING_SECURITY_USER_PASSWORD:?SPRING_SECURITY_USER_PASSWORD is required}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  frontend:
    image: ghcr.io/crossera-labs/runtime-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
